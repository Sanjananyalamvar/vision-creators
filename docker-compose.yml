# PostgreSQL for Recall. Schema is applied automatically on first start.
#   docker compose up -d
#   export DATABASE_URL=postgresql+psycopg://recall:recall@localhost:5432/recall
#   pip install "psycopg[binary]" && uvicorn app.main:app --reload && python seed_demo.py
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recall
      POSTGRES_PASSWORD: recall      # change for anything beyond local dev
      POSTGRES_DB: recall
    ports: ["5432:5432"]
    volumes:
      - recall_pg:/var/lib/postgresql/data
      - ./database/schema.postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recall -d recall"]
      interval: 5s
      retries: 10
volumes:
  recall_pg:
